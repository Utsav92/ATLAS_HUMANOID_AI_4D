[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-humanoid-ai-4d"
version = "1.0.0"
description = "ATLAS HUMANOID AI 4D - Multimodal Embodied AI Humanoid System with MuJoCo and TouchDesigner"
authors = [{ name = "Atlas Robotics Lab" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "mujoco>=3.1.0",
    "torch>=2.0.0",
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.0.0",
    "scikit-learn>=1.3.0",
    "opencv-python>=4.8.0",
    "onnxruntime>=1.16.0",
    "open3d>=0.17.0",
    "pyyaml>=6.0",
    "pytest>=7.4.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas*"]
